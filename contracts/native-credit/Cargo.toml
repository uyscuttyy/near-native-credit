[package]
name = "native-credit"
version = "0.1.0"
edition = "2021"
description = "Native Credit testnet lending prototype"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bs58 = "0.5.1"
hex = "0.4.3"
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa", "arithmetic"] }
near-sdk = "5.30.0"
rlp = "0.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4.3"
proptest = "1.4"
